name: Build Android App Bundle for Google Play

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor CLI and sync native project
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx cap sync android

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/onlooker-upload.keystore

      - name: Validate Android signing credentials
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ ! -s android/app/onlooker-upload.keystore ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing, invalid, or decoded to an empty file."
            exit 1
          fi

          for secret_name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            value="${!secret_name}"
            if [ -z "$value" ]; then
              echo "::error::$secret_name is missing."
              exit 1
            fi
            if ! LC_ALL=C grep -q '^[ -~]*$' <<< "$value"; then
              echo "::error::$secret_name must contain ASCII characters only. Re-enter it in GitHub Actions secrets without smart quotes, emoji, or non-breaking spaces."
              exit 1
            fi
          done

          keytool -list \
            -keystore android/app/onlooker-upload.keystore \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          # This upload keystore is PKCS12. Java uses the verified store
          # password for its private key as well; a separate key-password
          # secret caused the repeated BadPadding signing failure.
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          printf 'RESOLVED_ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_FILE: onlooker-upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.RESOLVED_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
        working-directory: android

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: onlooker-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
