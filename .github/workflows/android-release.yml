name: Build Android App Bundle for Google Play

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor CLI and sync native project
        run: 
          npm install --no-audit --no-fund --ignore-scripts
          npx cap sync android
      - name: Decode Keystore
    run: |
      echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/onlooker-upload.keystor
      - name: Check upload keystore
        run: |
          if [ ! -f android/app/onlooker-upload.keystore ]; then
            echo "::error::android/app/onlooker-upload.keystore is missing from the repository."
            exit 1
          fi
          ls -l android/app/onlooker-upload.keystore

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_FILE: onlooker-upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
        working-directory: android

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: onlooker-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      if-no-files-found: error
